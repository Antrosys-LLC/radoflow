<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" role="img" aria-label="Antrosys">
  <title>Antrosys</title>
  <!--
    The Antrosys whale mark, redrawn as vector so it stays sharp at the size
    the footer uses it. Replace this file with the official asset if the
    proportions need to be exact — every reference points at this path, so
    nothing else has to change.
  -->
  <g fill="#153B44">
    <!-- Tail fluke, upper left -->
    <path d="M1 2c0 0 3 9 8 15 6 7 13 10 18 12v20c0 0-8-2-15 6-6 7-8 15-8 15S-2 48 1 33 1 2 1 2Z"/>
    <path d="M27 17c0 0 3 6 8 10 5 4 11 6 18 6-4 5-11 10-18 10-3 0-5-1-6-2-2-2-2-6-2-9V22l0-5Z" transform="translate(8,4)"/>
    <!-- Body -->
    <path d="M25 45c0 0 0 12 2 22 4 22 16 40 33 50 4 3 9 5 13 6 1 8 5 14 11 16v-16h4c26 0 48-16 57-40 3-9 5-19 5-28H47c-2 0-5-2-8-6-6-8-9-16-10-22l-4 18Z"/>
  </g>
  <!-- The cream underside, cut from the body -->
  <path d="M83 139c0-30 24-54 54-56 1-4 2-8 2-12-38 2-68 32-68 68h12Z" fill="#F7F1E4"/>
  <!-- Eye -->
  <circle cx="92" cy="76" r="5" fill="#F7F1E4"/>
</svg>
